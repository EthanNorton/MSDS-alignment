resources:
  jobs:
    rl_data_platform_job:
      name: rl-data-platform-job
      tasks:
        - task_key: ingest_bronze
          spark_python_task:
            python_file: src/ingest_spark.py
          existing_cluster_id: ${var.cluster_id}

        - task_key: transform_silver_gold
          depends_on:
            - task_key: ingest_bronze
          spark_python_task:
            python_file: src/transform_spark.py
          existing_cluster_id: ${var.cluster_id}

        - task_key: train_rl
          depends_on:
            - task_key: transform_silver_gold
          spark_python_task:
            python_file: src/train_rl.py
          existing_cluster_id: ${var.cluster_id}

        - task_key: evaluate
          depends_on:
            - task_key: train_rl
          spark_python_task:
            python_file: src/evaluate.py
          existing_cluster_id: ${var.cluster_id}
